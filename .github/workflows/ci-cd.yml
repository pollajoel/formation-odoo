name: training mangement CI/CD

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

env: 
    PYTHON_VERSION: 3.11
jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
            - name: Install qualities tools
              run: |
                 pip install \
                 black \
                 isort \
                 pylint \
                 pylint-odoo
            - name: Run linters
              run: |
                 black --check ../../addons/training_management
                 isort --check-only ../../addons/training_management
                 pylint --disable=C0111,C0103 ../../addons/training_management
            - name: Run Odoo-specific linter
              run: pylint-odoo --disable=C0111,C0103 ../../addons/training_management