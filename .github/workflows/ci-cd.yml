name: training mangement CI/CD

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

env: 
    PYTHON_VERSION: 3.11
jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
            - name: Install qualities tools
              run: |
                 pip install \
                 black \
                 isort \
                 pylint \
                 pylint-odoo